
# Module main route
gc_vatnumber:
  path: gc_vatnumber
  methods: [GET, POST]
  defaults:
    _controller: Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\ConfigurationAdminController::indexAction
    _legacy_controller: 'GcVatnumberConfigurationAdminController'
    _legacy_link: 'GcVatnumberConfigurationAdminController'

# License
gc_vatnumber_license:
  path: gc_vatnumber/license
  methods: [GET, POST]
  defaults:
    _controller: Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\LicenseAdminController::indexAction
    _legacy_controller: 'GcVatnumberLicenseAdminController'
    _legacy_link: 'GcVatnumberLicenseAdminController'

gc_vatnumber_license_content:
  path: gc_vatnumber/license/content
  methods: [GET, POST]
  defaults:
    _controller: Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\LicenseAdminController::displayLicenseTextAction
    _legacy_controller: 'GcVatnumberLicenseAdminController'
    _legacy_link: 'GcVatnumberLicenseAdminController'

# Configuration
gc_vatnumber_configuration:
  path: gc_vatnumber/configuration
  methods: [GET, POST, PATCH]
  defaults:
    _controller: Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\ConfigurationAdminController::indexAction
    _legacy_controller: 'GcVatnumberConfigurationAdminController'
    _legacy_link: 'GcVatnumberConfigurationAdminController'



# Logs
gc_vatnumber_logs:
  path: gc_vatnumber/logs
  methods: [GET, POST]
  defaults:
    _controller: Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\LogAdminController::indexAction
    _legacy_controller: 'GcVatnumberLogsAdminController'
    _legacy_link: 'GcVatnumberLogsAdminController'

gc_vatnumber_logs_clear:
  path: gc_vatnumber/logs/clear
  methods: [ GET ]
  defaults:
    _controller:  Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\LogAdminController::clearAction
    _legacy_controller: GcVatnumberLogsAdminController
    _legacy_link: GcVatnumberLogsAdminController

gc_vatnumber_logs_view:
  path: gc_vatnumber/logs/view/{filename}
  methods: [ GET ]
  defaults:
    _controller:  Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\LogAdminController::viewAction
    _legacy_controller: GcVatnumberLogsAdminController
    _legacy_link: GcVatnumberLogsAdminController
  requirements:
    filename: '[0-9a-z_-]+\.log'

gc_vatnumber_logs_delete:
  path: gc_vatnumber/logs/delete/{filename}
  methods: [ GET ]
  defaults:
    _controller:  Onlineshopmodule\PrestaShop\Module\Vatnumber\Controller\LogAdminController::deleteAction
    _legacy_controller: GcVatnumberLogsAdminController
    _legacy_link: GcVatnumberLogsAdminController
  requirements:
    filename: '[0-9a-z_-]+\.log'

